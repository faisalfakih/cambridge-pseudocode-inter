name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build - ${{ matrix.platform.os }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64-apple-darwin
            name: cps-macos-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            name: cps-macos-x86_64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: cps-linux-x86_64
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: cps-linux-aarch64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            name: cps-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install cross-compile tools (Linux aarch64)
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.platform.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary (Unix)
        if: matrix.platform.runner != 'windows-latest'
        run: cp target/${{ matrix.platform.target }}/release/cps ${{ matrix.platform.name }}

      - name: Rename binary (Windows)
        if: matrix.platform.runner == 'windows-latest'
        run: cp target/${{ matrix.platform.target }}/release/cps.exe ${{ matrix.platform.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: ${{ matrix.platform.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
